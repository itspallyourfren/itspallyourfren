<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 185" width="620" height="185">
  <defs>
    <linearGradient id="hudBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="100%" stop-color="#131D31" />
    </linearGradient>
    <linearGradient id="dopamineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>
    <linearGradient id="resilienceGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <linearGradient id="zenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <style>
      .t-font { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; }
      @keyframes pulseDot { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.3; transform: scale(0.85); } }
      @keyframes waveSlide { 0% { transform: translateX(0); } 100% { transform: translateX(-40px); } }
      .live-pulse { animation: pulseDot 1.8s infinite ease-in-out; transform-origin: 28px 25px; }
      .wave-line { animation: waveSlide 2.5s infinite linear; }
    </style>
  </defs>

  <rect width="620" height="185" rx="16" fill="url(#hudBg)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Top Status Bar -->
  <circle cx="28" cy="25" r="4.5" fill="#10B981" class="live-pulse" />
  <text x="42" y="29" class="t-font" font-size="11" font-weight="700" fill="#38BDF8" letter-spacing="1">
    PSYCHOLOGY &amp; MIND TELEMETRY
  </text>
  <text x="480" y="29" class="t-font" font-size="11" font-weight="600" fill="#64748B">
    STATUS: CHILLING
  </text>
  <line x1="20" y1="42" x2="600" y2="42" stroke="#1E293B" stroke-width="1" />

  <!-- Gauge 1: Dopamine Level -->
  <text x="25" y="66" class="t-font" font-size="11" font-weight="600" fill="#E2E8F0">Dopamine Synthesis (Usagi Mode)</text>
  <text x="255" y="66" class="t-font" font-size="11" font-weight="700" fill="#FBBF24">100%</text>
  <rect x="25" y="74" width="250" height="7" rx="3.5" fill="#1E293B" />
  <rect x="25" y="74" width="250" height="7" rx="3.5" fill="url(#dopamineGrad)" />

  <!-- Gauge 2: Anxiety / Stress -->
  <text x="25" y="105" class="t-font" font-size="11" font-weight="600" fill="#E2E8F0">Anxiety &amp; Overthinking</text>
  <text x="255" y="105" class="t-font" font-size="11" font-weight="700" fill="#10B981">04%</text>
  <rect x="25" y="113" width="250" height="7" rx="3.5" fill="#1E293B" />
  <rect x="25" y="113" width="18" height="7" rx="3.5" fill="url(#zenGrad)" />

  <!-- Gauge 3: Resilience -->
  <text x="25" y="144" class="t-font" font-size="11" font-weight="600" fill="#E2E8F0">Resilience Index (NANTOKA NARE!)</text>
  <text x="255" y="144" class="t-font" font-size="11" font-weight="700" fill="#38BDF8">100%</text>
  <rect x="25" y="152" width="250" height="7" rx="3.5" fill="#1E293B" />
  <rect x="25" y="152" width="250" height="7" rx="3.5" fill="url(#resilienceGrad)" />

  <!-- Right Side: Brainwave Oscilloscope Mini Monitor -->
  <g transform="translate(315, 52)">
    <rect width="280" height="110" rx="10" fill="#06090F" stroke="#1E293B" />
    <text x="14" y="22" class="t-font" font-size="10" font-weight="700" fill="#818CF8" letter-spacing="0.5">
      ALPHA BRAINWAVE MONITOR
    </text>

    <!-- Oscilloscope Grid -->
    <line x1="14" y1="58" x2="266" y2="58" stroke="#1E293B" stroke-dasharray="3,3" />
    <line x1="14" y1="82" x2="266" y2="82" stroke="#1E293B" stroke-dasharray="3,3" />

    <!-- Animated Wave -->
    <g clip-path="url(#waveClip)">
      <clipPath id="waveClip">
        <rect x="14" y="32" width="252" height="45" />
      </clipPath>
      <path class="wave-line" fill="none" stroke="#38BDF8" stroke-width="2"
        d="M -40,55 Q -30,35 -20,55 T 0,55 T 20,55 T 40,55 T 60,35 T 80,75 T 100,55 T 120,38 T 140,72 T 160,55 T 180,35 T 200,75 T 220,55 T 240,40 T 260,70 T 280,55 T 300,35 T 320,55" />
    </g>

    <text x="14" y="96" class="t-font" font-size="10" font-weight="500" fill="#94A3B8">
      Freq: 10.4 Hz · State: Zen &amp; Flow
    </text>
  </g>
</svg>