<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 125" width="640" height="125">
  <defs>
    <linearGradient id="pastelSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="50%" stop-color="#F0F9FF" />
      <stop offset="100%" stop-color="#EFF6FF" />
    </linearGradient>
    <linearGradient id="tapeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#93C5FD" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#BFDBFE" stop-opacity="0.8" />
    </linearGradient>
    <style>
      .b-title { font-family: 'Comfortaa', 'Quicksand', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 800; fill: #1E3A8A; letter-spacing: 0.5px; }
      .b-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #3B82F6; }
      .b-tag { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', monospace; font-size: 11px; font-weight: 700; fill: #60A5FA; letter-spacing: 1.5px; }
      @keyframes floatSoft { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-3px); } }
      .float-badge { animation: floatSoft 3s infinite ease-in-out; }
    </style>
  </defs>

  <!-- Cute Sticker Background with Soft Rounded Corners -->
  <rect x="6" y="10" width="628" height="105" rx="22" fill="url(#pastelSky)" stroke="#93C5FD" stroke-width="2.5" />

  <!-- Washi Tape on Top Corners -->
  <rect x="35" y="4" width="70" height="15" rx="3" fill="url(#tapeGrad)" transform="rotate(-3 70 10)" />
  <rect x="535" y="4" width="70" height="15" rx="3" fill="url(#tapeGrad)" transform="rotate(3 570 10)" />

  <!-- Decorative Cute Stars / Sparkles -->
  <g fill="#FBBF24">
    <path d="M 45 65 Q 48 55 58 52 Q 48 49 45 39 Q 42 49 32 52 Q 42 55 45 65 Z" />
    <path d="M 595 72 Q 597 64 605 62 Q 597 60 595 52 Q 593 60 585 62 Q 593 64 595 72 Z" />
    <circle cx="95" cy="85" r="3" fill="#60A5FA" />
    <circle cx="545" cy="42" r="3" fill="#F472B6" />
    <circle cx="560" cy="85" r="2.5" fill="#38BDF8" />
  </g>

  <!-- Clouds -->
  <path d="M 120 42 C 120 37 125 33 130 33 C 133 29 139 27 145 28 C 151 28 156 31 158 35 C 163 35 167 39 167 44 C 167 49 162 52 157 52 L 128 52 C 123 52 120 48 120 42 Z" fill="#FFFFFF" opacity="0.85" />
  <path d="M 470 78 C 470 73 475 69 480 69 C 483 65 489 63 495 64 C 501 64 506 67 508 71 C 513 71 517 75 517 80 C 517 85 512 88 507 88 L 478 88 C 473 88 470 84 470 78 Z" fill="#FFFFFF" opacity="0.85" />

  <!-- Text Header -->
  <g class="float-badge">
    <text x="320" y="42" text-anchor="middle" class="b-tag">✦ CHIIKAWA &amp; HACHIWARE UNIVERSE ✦</text>
    <text x="320" y="75" text-anchor="middle" class="b-title">@itspallyourfren</text>
    <text x="320" y="99" text-anchor="middle" class="b-sub">Psychology Student · Human Behavior &amp; Mind · 何とかなれッ! 🌸</text>
  </g>
</svg>