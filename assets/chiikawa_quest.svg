<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 185" width="620" height="185">
  <defs>
    <linearGradient id="questGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
    <style>
      .q-text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif; }
      @keyframes glow { 0%, 100% { stroke: #38BDF8; } 50% { stroke: #818CF8; } }
      .border-glow { animation: glow 4s infinite ease-in-out; }
    </style>
  </defs>

  <rect width="620" height="185" rx="16" fill="url(#questGrad)" class="border-glow" stroke="#38BDF8" stroke-width="1.5" />

  <!-- Badge Header -->
  <rect x="22" y="16" width="170" height="24" rx="6" fill="#1E293B" stroke="#334155" />
  <text x="32" y="32" class="q-text" font-size="11" font-weight="700" fill="#38BDF8">
    CHIIKAWA GUILD CARD
  </text>
  <text x="500" y="32" class="q-text" font-size="11" font-weight="600" fill="#94A3B8">
    RANK: ★★★★★
  </text>

  <!-- Title & Character -->
  <text x="22" y="66" class="q-text" font-size="18" font-weight="700" fill="#F8FAFC">
    @itspallyourfren
  </text>
  <text x="22" y="86" class="q-text" font-size="13" font-weight="500" fill="#94A3B8">
    Class: Psychology Student · Specialty: Curiosity &amp; Nantoka Nare
  </text>

  <!-- Status Meters -->
  <!-- Meter 1 -->
  <text x="22" y="118" class="q-text" font-size="12" font-weight="600" fill="#E2E8F0">
    Empathy &amp; Mind Observance
  </text>
  <rect x="22" y="125" width="265" height="8" rx="4" fill="#334155" />
  <rect x="22" y="125" width="265" height="8" rx="4" fill="url(#cyanGrad)" />

  <!-- Meter 2 -->
  <text x="22" y="152" class="q-text" font-size="12" font-weight="600" fill="#E2E8F0">
    Resilience (Nantoka Spirit)
  </text>
  <rect x="22" y="159" width="265" height="8" rx="4" fill="#334155" />
  <rect x="22" y="159" width="265" height="8" rx="4" fill="url(#cyanGrad)" />

  <!-- Quests Column -->
  <g transform="translate(325, 55)">
    <rect width="270" height="110" rx="10" fill="#090D16" stroke="#1E293B" />
    <text x="14" y="24" class="q-text" font-size="11" font-weight="700" fill="#38BDF8">DAILY GUILD QUESTS</text>
    
    <text x="14" y="46" class="q-text" font-size="11" font-weight="500" fill="#CBD5E1">✓ Observe human behavior quirks</text>
    <text x="14" y="66" class="q-text" font-size="11" font-weight="500" fill="#CBD5E1">✓ Keep GitHub graph 100% green</text>
    <text x="14" y="86" class="q-text" font-size="11" font-weight="500" fill="#CBD5E1">✓ Shout "UNAAAA!" when stressed</text>
  </g>
</svg>
