<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 125" width="620" height="125">
  <defs>
    <linearGradient id="dlgBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <style>
      .dlg-font { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      @keyframes blinkArrow { 0%, 100% { opacity: 1; transform: translateY(0); } 50% { opacity: 0.2; transform: translateY(3px); } }
      .prompt-arrow { animation: blinkArrow 1.2s infinite ease-in-out; }
    </style>
  </defs>

  <!-- Dialog Box Frame -->
  <rect width="620" height="125" rx="14" fill="url(#dlgBg)" stroke="#38BDF8" stroke-width="1.6" />

  <!-- Speaker Tag -->
  <rect x="22" y="14" width="130" height="22" rx="6" fill="#38BDF8" />
  <text x="87" y="29" text-anchor="middle" class="dlg-font" font-size="11" font-weight="800" fill="#0F172A">
    HACHIWARE BLUE
  </text>

  <text x="165" y="29" class="dlg-font" font-size="11" font-weight="500" fill="#64748B">
    [ Chiikawa Universe Dialogue Box ]
  </text>

  <!-- Dialog Content -->
  <text x="24" y="60" class="dlg-font" font-size="14" font-weight="700" fill="#F8FAFC">
    &ldquo;何とかなれーッ!! (Nantoka nare!)&rdquo;
  </text>
  <text x="24" y="82" class="dlg-font" font-size="12.5" font-weight="500" fill="#94A3B8">
    Kalo lagi buntu atau capek: tarik napas santai, dengerin lofi,
  </text>
  <text x="24" y="102" class="dlg-font" font-size="12.5" font-weight="500" fill="#94A3B8">
    dan teriak &ldquo;UNAAAA!&rdquo; bareng Usagi! Semua pasti bakal baik-baik aja.
  </text>

  <!-- Animated Prompt Arrow -->
  <path d="M 590,98 L 596,105 L 602,98 Z" fill="#38BDF8" class="prompt-arrow" />
</svg>