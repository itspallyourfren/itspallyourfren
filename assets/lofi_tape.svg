<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 125" width="640" height="125">
  <defs>
    <linearGradient id="tapeBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="100%" stop-color="#BAE6FD" />
    </linearGradient>
    <linearGradient id="labelGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FEFCE8" />
      <stop offset="100%" stop-color="#FEF9C3" />
    </linearGradient>
    <style>
      .t-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 800; fill: #0369A1; }
      .t-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 600; fill: #0284C7; }
      @keyframes spinReel { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      .reel-1 { animation: spinReel 4s infinite linear; transform-origin: 75px 62px; }
      .reel-2 { animation: spinReel 4s infinite linear; transform-origin: 155px 62px; }
    </style>
  </defs>

  <!-- Cassette Tape Body -->
  <rect x="8" y="10" width="624" height="105" rx="16" fill="url(#tapeBody)" stroke="#7DD3FC" stroke-width="2" />

  <!-- Tape Screws -->
  <circle cx="22" cy="22" r="3" fill="#7DD3FC" />
  <circle cx="618" cy="22" r="3" fill="#7DD3FC" />
  <circle cx="22" cy="103" r="3" fill="#7DD3FC" />
  <circle cx="618" cy="103" r="3" fill="#7DD3FC" />

  <!-- Inner Label Sticker (Pastel Cream) -->
  <rect x="40" y="22" width="560" height="80" rx="10" fill="url(#labelGrad)" stroke="#FDE047" stroke-width="1.5" />

  <!-- Cassette Spools Window -->
  <rect x="55" y="42" width="120" height="42" rx="8" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1.5" />
  
  <!-- Left Spool -->
  <circle cx="75" cy="62" r="14" fill="#FFFFFF" stroke="#0284C7" stroke-width="2" />
  <g class="reel-1">
    <line x1="75" y1="48" x2="75" y2="76" stroke="#0284C7" stroke-width="2" />
    <line x1="61" y1="62" x2="89" y2="62" stroke="#0284C7" stroke-width="2" />
    <circle cx="75" cy="62" r="5" fill="#0284C7" />
  </g>

  <!-- Right Spool -->
  <circle cx="155" cy="62" r="14" fill="#FFFFFF" stroke="#0284C7" stroke-width="2" />
  <g class="reel-2">
    <line x1="155" y1="48" x2="155" y2="76" stroke="#0284C7" stroke-width="2" />
    <line x1="141" y1="62" x2="169" y2="62" stroke="#0284C7" stroke-width="2" />
    <circle cx="155" cy="62" r="5" fill="#0284C7" />
  </g>

  <!-- Label Track Information -->
  <g transform="translate(200, 42)">
    <text x="0" y="15" class="t-title">📻 Hachiware's Lo-Fi Cassette Tape · SIDE A</text>
    <text x="0" y="36" class="t-sub">♫ Now Playing: ひとりごつ (Hitorigottsu) · Nantoka Nare Lofi Mix</text>
    <text x="0" y="54" class="t-sub" fill="#64748B">● Status: Loop On Repeat · Volume: 100% · Mood: Cozy</text>
  </g>
</svg>