<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 120" width="640" height="120">
  <defs>
    <linearGradient id="certBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0FDF4" />
      <stop offset="100%" stop-color="#DCFCE7" />
    </linearGradient>
    <style>
      .c-title { font-family: 'Hiragino Maru Gothic ProN', -apple-system, sans-serif; font-size: 15px; font-weight: 800; fill: #166534; }
      .c-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12.5px; font-weight: 600; fill: #15803D; }
      .c-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 500; fill: #4B5563; }
    </style>
  </defs>

  <!-- Certificate Sticker Card -->
  <rect x="8" y="10" width="624" height="100" rx="16" fill="url(#certBg)" stroke="#86EFAC" stroke-width="2" />
  <rect x="15" y="17" width="610" height="86" rx="10" fill="none" stroke="#BBF7D0" stroke-width="1.5" stroke-dasharray="5,4" />

  <!-- Icon Stamp on Left -->
  <g transform="translate(30, 26)">
    <rect width="68" height="68" rx="12" fill="#FFFFFF" stroke="#86EFAC" stroke-width="2" />
    <text x="34" y="32" text-anchor="middle" font-size="22">🌱</text>
    <text x="34" y="54" text-anchor="middle" font-size="11" font-weight="800" fill="#166534">5級 合格</text>
  </g>

  <!-- Details -->
  <g transform="translate(120, 36)">
    <text x="0" y="14" class="c-title">📜 草むしり検定 (Weeding License) · Grade 5</text>
    <text x="0" y="36" class="c-sub">Holder: @itspallyourfren · Partner: Hachiware &amp; Chiikawa</text>
    <text x="0" y="56" class="c-desc">Kualifikasi: Mampu mencabut rumput liar, pantang menyerah, &amp; selalu teriak "Nantoka nare!"</text>
  </g>
</svg>